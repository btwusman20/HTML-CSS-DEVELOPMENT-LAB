<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 14 - CSS Grid Layouts</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Lab 14: CSS Grid Layouts</h1>

        <section class="grid-section">
            <h2>1. Three-Column Grid (<a href="grid-first.html">grid-first.html</a>)</h2>
            <div class="grid">
                <div class="box">1</div><div class="box">2</div><div class="box">3</div>
                <div class="box">4</div><div class="box">5</div><div class="box">6</div>
            </div>
        </section>

        <section class="grid-section">
            <h2>2. Responsive Gallery (<a href="gallery.html">gallery.html</a>)</h2>
            <h1>Club Photo Gallery</h1>
            <div class="gallery">
                <div class="photo">Photo 1</div><div class="photo">Photo 2</div>
                <div class="photo">Photo 3</div><div class="photo">Photo 4</div>
                <div class="photo">Photo 5</div><div class="photo">Photo 6</div>
            </div>
        </section>

        <section class="grid-section">
            <h2>3. Dashboard Named Areas (<a href="dashboard-areas.html">dashboard-areas.html</a>)</h2>
            <div class="dashboard">
                <div class="header">Header</div>
                <div class="sidebar">Sidebar</div>
                <div class="main">Main area</div>
                <div class="footer">Footer</div>
            </div>
        </section>
    </div>
</body>
</html>
