<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Variables</title>
    <style>
        :root {
            --main-color: #1d3557;
            --accent-color: #e63946;
            --page-padding: 20px;
        }
        body { color: var(--main-color); padding: var(--page-padding); }
        h1 { color: var(--accent-color); }
    </style>
</head>
<body>
    <h1>Learning CSS Variables</h1>
    <p>CSS custom properties keep design values consistent.</p>
</body>
</html>
