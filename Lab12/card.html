<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Card</title>
    <style>
        .card {
            background-color: #eaf2f8;
            border: 2px solid #1d3557;
            border-radius: 12px;
            padding: 16px;
            max-width: 320px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h3>My First Card</h3>
        <p>This card demonstrates background, border, rounded corners and padding.</p>
    </div>
</body>
</html>
